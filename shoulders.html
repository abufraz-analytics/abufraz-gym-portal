<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoulder Definition - Abu Fraz Abbas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0f;
            --card-bg: #14141c;
            --accent-color: #f39c12;
            --accent-glow: rgba(243, 156, 18, 0.3);
            --text-main: #ffffff;
            --text-muted: #a0a0a5;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Top Navigation Bar */
        .top-nav {
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 20px 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            color: var(--accent-color);
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(243, 156, 18, 0.3);
            transition: var(--transition);
        }

        .back-btn:hover {
            background: var(--accent-color);
            color: #000;
            transform: translateX(-4px);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Header Section */
        header {
            text-align: center;
            padding: 40px 20px 30px;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 span {
            color: var(--accent-color);
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Gallery Section */
        .gallery-section {
            max-width: 1300px;
            margin: 20px auto 100px;
            padding: 0 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .gallery-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
        }

        .gallery-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px var(--accent-glow);
            border-color: rgba(243, 156, 18, 0.3);
        }

        .image-wrapper {
            width: 100%;
            height: 380px;
            overflow: hidden;
            position: relative;
        }

        .image-wrapper img,
        .image-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .gallery-card:hover .image-wrapper img,
        .gallery-card:hover .image-wrapper video {
            transform: scale(1.08);
        }

        /* Video Badge */
        .video-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 2;
            backdrop-filter: blur(4px);
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Lightbox Fullscreen Modal */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-content-box {
            position: relative;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-modal img,
        .lightbox-modal video {
            max-width: 100%;
            max-height: 62vh;
            object-fit: contain;
            border-radius: 8px;
            border: 2px solid rgba(243, 156, 18, 0.4);
            box-shadow: 0 0 30px rgba(243, 156, 18, 0.2);
            cursor: pointer;
            transition: var(--transition);
        }

        .lightbox-details {
            margin-top: 15px;
            text-align: center;
        }

        .lightbox-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .lightbox-actions {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
        }

        .download-btn {
            background: var(--accent-color);
            color: #000;
            padding: 10px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .download-btn:hover {
            background: #ffa500;
            transform: scale(1.05);
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
            color: var(--text-main);
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10001;
        }

        .close-lightbox:hover {
            color: var(--accent-color);
        }

        /* Navigation Arrows inside Lightbox */
        .lightbox-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(20, 20, 28, 0.8);
            color: var(--accent-color);
            border: 1px solid rgba(243, 156, 18, 0.3);
            font-size: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10000;
        }

        .lightbox-nav-btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .prev-btn {
            left: -70px;
        }

        .next-btn {
            right: -70px;
        }

        /* Super Fullscreen View for Second Click */
        body.super-fullscreen-mode .lightbox-content-box {
            max-width: 100% !important;
            height: 100%;
            justify-content: center;
        }

        body.super-fullscreen-mode .lightbox-modal img,
        body.super-fullscreen-mode .lightbox-modal video {
            max-height: 92vh !important;
            max-width: 95vw !important;
            border: none;
            box-shadow: none;
            border-radius: 0;
        }

        body.super-fullscreen-mode .lightbox-details,
        body.super-fullscreen-mode .download-btn {
            display: none !important;
        }

        /* Footer */
        footer {
            background: linear-gradient(to top, #07070a, var(--card-bg));
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 20px;
            text-align: center;
            color: rgba(160, 160, 165, 0.6);
            font-size: 0.85rem;
            margin-top: 80px;
        }

        @media (max-width: 1024px) {
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.1rem; }
            .image-wrapper { height: 320px; }
            .close-lightbox { top: 10px; right: 15px; }
            .lightbox-nav-btn { width: 40px; height: 40px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="upper-body.html" class="back-btn">
            &larr; Back to Upper Body Archive
        </a>
    </div>

    <header>
        <h1>Shoulder <span>Definition</span></h1>
        <p class="section-desc">
            Hardcoded Cloudinary archive for 3D capped delts, lateral head striations, and heavy overhead stability.
        </p>
    </header>

    <section class="gallery-section">
        <div class="gallery-grid" id="galleryGrid">
            </div>
    </section>

    <div id="lightboxModal" class="lightbox-modal">
        <button class="close-lightbox" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-content-box">
            <button class="lightbox-nav-btn prev-btn" onclick="changeSlide(-1)">&#10094;</button>
            
            <div id="mediaViewerContainer" style="width:100%; display:flex; justify-content:center; align-items:center;">
                </div>

            <button class="lightbox-nav-btn next-btn" onclick="changeSlide(1)">&#10095;</button>
            
            <div class="lightbox-details">
                <h3 id="lightboxTitle" class="lightbox-title"></h3>
                <div class="lightbox-actions">
                    <a id="downloadLink" href="" target="_blank" download class="download-btn">
                        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        Download File
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Abu Fraz Abbas. All Rights Reserved. Shoulder Definition Archive.
    </footer>

    <script>
        const galleryData = [
            {
                type: "image",
                src: "https://res.cloudinary.com/gz546ufv/image/upload/v1787990276/IMG_4180_gsvmze.jpg",
                title: "Seated Overhead Dumbbell Press",
                desc: "Mass building and front delt explosion."
            },
            {
                type: "image",
                src: "https://res.cloudinary.com/gz546ufv/image/upload/v1787990275/IMG_4181_xuv3lw.jpg",
                title: "Cable Lateral Raises",
                desc: "Constant tension for wide capped side delts."
            },
            {
                type: "image",
                src: "https://res.cloudinary.com/gz546ufv/image/upload/v1787990275/IMG_4182_vdnde8.jpg",
                title: "Rear Delt Flyes",
                desc: "Posterior chain balance and 3D depth."
            },
            {
                type: "image",
                src: "https://res.cloudinary.com/gz546ufv/image/upload/v1787990275/IMG_4183_jcgfan.jpg",
                title: "Barbell Upright Row",
                desc: "Trap tie-ins and heavy shoulder framing."
            }
            // To add a video here later, set type to "video" and provide the video source link
        ];

        let currentIndex = 0;

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = "";

            galleryData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.onclick = () => openLightbox(index);

                let mediaHTML = '';
                if (item.type === 'video') {
                    mediaHTML = `
                        <div class="image-wrapper">
                            <video src="${item.src}" muted preload="metadata"></video>
                            <div class="video-badge">
                                <svg width="10" height="10" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> VIDEO
                            </div>
                        </div>
                    `;
                } else {
                    mediaHTML = `
                        <div class="image-wrapper">
                            <img src="${item.src}" alt="${item.title}" loading="lazy">
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${mediaHTML}
                    <div class="card-content">
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openLightbox(index) {
            currentIndex = index;
            document.body.classList.remove('super-fullscreen-mode');
            updateLightboxContent();
            document.getElementById('lightboxModal').classList.add('active');
        }

        function closeLightbox() {
            document.body.classList.remove('super-fullscreen-mode');
            document.getElementById('lightboxModal').classList.remove('active');
            const activeVideo = document.querySelector('#mediaViewerContainer video');
            if (activeVideo) activeVideo.pause();
        }

        function toggleSuperFullscreen(e) {
            e.stopPropagation();
            document.body.classList.toggle('super-fullscreen-mode');
        }

        function changeSlide(direction) {
            const activeVideo = document.querySelector('#mediaViewerContainer video');
            if (activeVideo) activeVideo.pause();

            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = galleryData.length - 1;
            } else if (currentIndex >= galleryData.length) {
                currentIndex = 0;
            }
            updateLightboxContent();
        }

        function updateLightboxContent() {
            const item = galleryData[currentIndex];
            const container = document.getElementById('mediaViewerContainer');
            document.getElementById('lightboxTitle').textContent = item.title;

            if (item.type === 'video') {
                container.innerHTML = `
                    <video id="lightboxMedia" src="${item.src}" controls autoplay playsinline onclick="toggleSuperFullscreen(event)"></video>
                `;
            } else {
                container.innerHTML = `
                    <img id="lightboxMedia" src="${item.src}" alt="${item.title}" onclick="toggleSuperFullscreen(event)">
                `;
            }
            
            const downloadBtn = document.getElementById('downloadLink');
            downloadBtn.onclick = function(e) {
                e.preventDefault();
                downloadFile(item.src, item.title, item.type);
            };
        }

        async function downloadFile(url, filename, type) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                const ext = type === 'video' ? '.mp4' : '.jpg';
                a.download = filename.toLowerCase().replace(/[^a-z0-9]/g, '_') + ext;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (err) {
                window.open(url, '_blank');
            }
        }

        document.getElementById('lightboxModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('lightboxModal').classList.contains('active')) return;
            
            if (e.key === 'ArrowLeft') {
                changeSlide(-1);
            } else if (e.key === 'ArrowRight') {
                changeSlide(1);
            } else if (e.key === 'Escape') {
                if (document.body.classList.contains('super-fullscreen-mode')) {
                    document.body.classList.remove('super-fullscreen-mode');
                } else {
                    closeLightbox();
                }
            }
        });

        let touchStartX = 0;
        let touchEndX = 0;
        const modalBox = document.getElementById('lightboxModal');

        modalBox.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        });

        modalBox.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                changeSlide(1);
            }
            if (touchEndX > touchStartX + 50) {
                changeSlide(-1);
            }
        }

        window.addEventListener('DOMContentLoaded', renderGallery);
    </script>

</body>
</html>
